name: hinata
description: "Hinata - open source, self-hosted project management."
publish_to: 'none'

version: 10.8.0+96

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Clean (path-based) URLs for Flutter web (no /#/ in the address bar)
  flutter_web_plugins:
    sdk: flutter

  # State management (Bloc family)
  bloc: ^9.1.0
  flutter_bloc: ^9.1.0
  hydrated_bloc: ^10.1.0
  bloc_concurrency: ^0.3.0
  replay_bloc: ^0.3.0
  equatable: ^2.0.7

  # Routing
  go_router: ^16.0.0

  # Networking & storage
  dio: ^5.7.0
  # Web-only: a Fetch API HTTP client so Server-Sent Events (live comments,
  # reactions, attachments…) actually stream on the web build — dio's XHR web
  # adapter buffers the whole response and never yields an open SSE stream.
  # Consumed solely by sse_transport_web.dart; native uses dio.
  fetch_client: ^1.1.2
  http: ^1.2.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^10.3.1
  path_provider: ^2.1.0

  # Internationalization (i18next)
  i18next: ^0.9.0
  intl: any
  # The device's IANA time zone (Europe/Berlin), for the one thing the server
  # cannot work out for itself: a server-rendered document has to be stamped on
  # the reader's clock, and nothing in an HTTP request says where the reader is.
  # Dart alone cannot answer it — DateTime.timeZoneName gives an abbreviation
  # ("CEST"), and an abbreviation is ambiguous across zones — so this is a
  # plugin rather than a helper. Every use of it is wrapped: a platform that
  # cannot answer leaves the export to the organization's configured zone.
  flutter_timezone: ^5.1.0

  # UX
  animations: ^2.0.11
  wolt_modal_sheet: ^0.11.0
  fl_chart: ^1.1.1

  # Liquid Glass UI: the iOS 27 glass material (frost, rimShade/rimLight,
  # GlassLensModel.paraxial), the iOS 27 performance work (#359, in 1.9.0) and
  # our accessibility pass (#382, merged as #387 into 1.10.0). Back on the
  # published package; 1.12.0 is the first release with #417 (morph springs
  # stop once nothing visibly moves), 1.13.0 adds routeSettings on modal
  # sheets and the half-folded iPhone Duo. 1.14.0 carries the menu mouse-hover
  # fix (#430), so the fork tag is gone again; 1.14.2 adds the ProgressiveBlur
  # repaint under moving ancestors (#444) and live submenu cards (#443).
  liquid_glass_widgets: ^1.14.2

  # Rich text. Documents are stored as Lexical JSON, so this is both the editor
  # and the renderer; there is no second markdown path any more. The bundle
  # brings every node type the server can emit.
  lexical_editor_flutter: ^1.9.2
  lexical_markdown: ^1.7.4

  # Reporting / export
  pdf: ^3.11.0
  # >=5.15.0 loads pdf.js as an ES module (dynamic import of pdf.min.mjs); the
  # exact pdf.js version is pinned in web/index.html via dartPdfJsVersion so that
  # JPEG2000 images decode without the OpenJPEG WASM that pdf.js 5+ requires.
  printing: ^5.15.0
  flutter_svg: ^2.0.10

  # QR matrix generation for 2FA enrolment (pure-Dart; painted via CustomPainter)
  qr: ^3.0.0

  # Platform integration
  url_launcher: ^6.3.0
  app_links: ^6.3.0
  # High-refresh-rate (90/120 Hz) on Android. Android renders the Flutter surface
  # at the panel's *default* mode (usually 60 Hz) unless the app explicitly opts
  # into the highest supported mode, which is why static screens sit at 60 Hz
  # while continuous animations opportunistically boost to 120. iOS/macOS are
  # already covered by CADisableMinimumFrameDurationOnPhone in Info.plist.
  flutter_displaymode: ^0.6.0
  package_info_plus: ^9.0.0
  # Browser download (Blob + anchor) for authenticated file downloads on web.
  web: ^1.1.0

  # Attachments: native file picker + desktop drag-and-drop + photo/video gallery
  # & camera capture (image_picker drives the gallery/camera source on mobile).
  #
  # The file dialog is split across two packages, one per platform family, behind
  # lib/core/util/file_pick.dart. file_picker covers Android, iOS, macOS, Windows
  # and web — it is the only one of the two with an Android implementation, and
  # everywhere else the two land in the same system dialog anyway.
  # 10.3.8 renamed its iOS class FileUtils, which clashed with one of the same
  # name in Apple's OSAnalytics ("Class FileUtils is implemented in both").
  # 11 moves to static methods, a bigger change for no gain here.
  file_picker: ^10.3.10
  # Linux uses file_selector instead, and the difference is not cosmetic:
  # file_picker's Linux "implementation" is pure Dart and shells out to zenity,
  # qarma or kdialog. A snap under strict confinement has none of them on $PATH,
  # so the dialog never opened and nothing said why; a Flatpak runs them inside
  # the sandbox, where they can only show the sandbox's view of the filesystem.
  # file_selector_linux is a real plugin calling gtk_file_chooser_native_new,
  # which GTK hands to the XDG FileChooser portal whenever the app is sandboxed.
  #
  # Both were already in the tree as transitive dependencies of
  # image_picker_linux; they are named here because file_pick.dart imports them
  # directly (depend_on_referenced_packages), and because the registration this
  # relies on must not be an accident of what image_picker happens to pull in.
  file_selector_linux: ^0.9.3
  # FileSelectorPlatform + XTypeGroup: the interface file_pick.dart programs
  # against, so it never names a platform implementation in its code.
  file_selector_platform_interface: ^2.6.0
  image_picker: ^1.1.2
  # Desktop camera capture. image_picker_windows/_macos cannot use
  # ImageSource.camera on their own — they delegate it to an
  # ImagePickerCameraDelegate, which we implement on top of this plugin
  # (see lib/core/platform/desktop_camera_delegate.dart).
  camera: ^0.11.0
  # camera does NOT endorse its Windows implementation (its own pubspec lists
  # android/ios/web only), so the platform package has to be depended on
  # explicitly — otherwise availableCameras() finds nothing on Windows.
  camera_windows: ^0.2.6
  # Direct dependency because desktop_camera_delegate.dart implements
  # ImagePickerCameraDelegate from it (implementation-imports lint).
  image_picker_platform_interface: ^2.10.0
  # 0.6.1 or newer, or the Linux build breaks on Ubuntu 24.04 and later: the
  # plugin called std::getenv without including <cstdlib>, which compiles only
  # where another header happens to pull it in. 22.04 does, core24 does not, so
  # this surfaced the first time the snap was built and not before. Upstream
  # fixed it in 0.6.1 — literally "fix Linux snap build failure due to missing
  # stdlib.h include". 0.8.0 is deliberately not taken: it requires Android
  # Gradle Plugin 9.
  desktop_drop: ^0.7.1
  # The timer outside the app on the desktop (HIN-101), each behind its own
  # adapter in lib/core/timer_surfaces/adapters/. tray_manager stays on 0.5.x,
  # the last plain plugin: 0.6 and later build a C++ core (cnativeapi) through
  # a native-assets hook for every target the app has, phones included, and
  # put the Linux menu on a D-Bus path the snap's unity7 interface does not
  # allow. The adapter is what keeps a later move to nativeapi one file.
  tray_manager: 0.5.3
  window_manager: ^0.5.2
  # Our own (hinata-platform/system_hotkeys): RegisterEventHotKey on macOS,
  # RegisterHotKey on Windows, the GlobalShortcuts portal on Linux (HIN-107),
  # conflicts reported. No keyboard hook, no key grab.
  system_hotkeys: ^0.2.0
  # 0.2.0 carries the macOS fixes of 0.1.1 (super_native_extensions' Carbon
  # handler swallowed every press) and 0.1.2 (bare keys refused natively).
  system_hotkeys_macos: ^0.2.0
  # 0.2.0 carries 0.1.2: owns its channels and reuses freed hot key numbers.
  system_hotkeys_windows: ^0.2.0
  # Imported for its app id registration (an AppImage is not known to the
  # portal by a sandbox).
  system_hotkeys_linux: ^0.2.1
  # Our own (hinata-platform/alarm_kit, HIN-106): the end of an interval as a
  # system alarm on iOS and iPadOS 26. Below that it answers "unsupported".
  alarm_kit: ^0.1.1
  # Linux: whether a StatusNotifierItem host is there at all. Without one
  # libayatana shows nothing and reports nothing, and a window must not hide
  # into a tray nobody sees. Pure Dart (Canonical), already in the tree.
  dbus: ^0.7.11
  cross_file: ^0.3.4+2
  # Native download: present the OS share sheet on a downloaded attachment so the
  # user can "Save to Files" (iOS) / save to Downloads (Android) or send it on,
  # instead of dumping it in a hidden app directory.
  share_plus: ^11.0.0

  # Voice comments: mic capture + live amplitude (record) and playback (just_audio).
  # Cross-platform (mobile/desktop/web); web plays the audio via a Blob URL.
  record: ^6.1.2
  just_audio: ^0.10.5
  # just_audio itself declares android/ios/macos/web only — without this the
  # Windows build registers no playback implementation and every voice comment
  # fails to play (recording works, `record` supports Windows). Federated
  # platform package (WinRT MediaPlayer): no code change, just registration.
  just_audio_windows: ^0.2.2
  # Linux has the same hole and no package to fill it — nobody publishes a
  # just_audio_linux — so this one is ours: the same federated shape, with
  # GStreamer's playbin behind it. See packages/just_audio_linux/README.md.
  just_audio_linux:
    path: packages/just_audio_linux

  # Comment reactions: full emoji picker (device emoji font) behind the "…" button
  # on the quick-reactions bar.
  emoji_picker_flutter: ^4.3.0
  # Rich clipboard: copy a comment's inline image as real image data (Flutter's
  # built-in Clipboard is text-only). Text comments still copy as text.
  super_clipboard: ^0.9.1

  cupertino_icons: ^1.0.8

  # Icons — Lucide (lucide.dev). Frontend convention: use ONLY these icons,
  # never Material (Icons.*) or Cupertino (CupertinoIcons.*).
  lucide_icons_flutter: ^3.1.14
  # Pinned exactly as a guard even though pubspec.lock is now checked in:
  # firebase_messaging 16.4.2 is a broken upstream release (its messaging.dart
  # references a `FirebasePlugin` base type absent from its platform interface →
  # "Type 'FirebasePlugin' not found" on web compile). The pin stops a stray
  # `pub upgrade` from reintroducing it. Bump both together only after a
  # `flutter build web --wasm --release` succeeds.
  firebase_core: 4.11.0
  firebase_messaging: 16.4.1
  # BlurHash *decoding* only (the ~100-line reference algorithm, plus an
  # ImageProvider that turns a hash into a picture). Encoding happens on the
  # server, which is the only place that has the original bytes — see
  # `BlurHash.java`. Used through [HivePreviewImage].
  flutter_blurhash: ^0.9.1
  # The timer outside the app (HIN-100): the end of an interval scheduled as a
  # system notification on Android, iOS, macOS and Linux, and the running timer
  # as an ongoing notification on Android. Not on Windows (the runner's own
  # toast channel, one ToastActivatorCLSID per MSIX) and not on the web
  # (package:web). Scheduled in UTC, so `timezone` is used without its database.
  # HIN-104: our fork of 22.3.2 with the Android 16 live updates (upstream
  # #2810, released only in the 23.0 previews that need AGP 9) and the Android
  # 17 metric style. Back to pub.dev once 23.0 is stable.
  flutter_local_notifications:
    git:
      url: https://github.com/hinata-platform/flutter_local_notifications.git
      # A commit of the branch `hinata`, not the branch: an upgrade must never
      # pull native notification code nobody looked at.
      ref: 89f6021db49c918d51219f83d7eb51e2f1b7ef6f
      path: flutter_local_notifications
  # Home and lock-screen widgets (HIN-102): App Group store on iOS, the
  # plugin's preferences on Android, and the reload of both.
  home_widget: ^0.9.4
  # Our own (hinata-platform/widgetkit_macos, HIN-108): the same record for
  # the Mac's widgets, which home_widget cannot reach.
  widgetkit_macos: ^0.1.2
  # HIN-103: whether the keyguard is up, in the background engines too.
  hinata_device_lock:
    path: packages/hinata_device_lock
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  # Tests stub CameraPlatform.instance to drive the desktop capture delegate
  # through its failure modes. `camera` re-exports the types but not the
  # platform interface itself, so the test needs the package directly.
  camera_platform_interface: ^2.13.1
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.0
  # Microsoft Store packaging (windows/fastlane → `dart run msix:create --store`)
  msix: ^3.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/en/
    - assets/i18n/de/
    - assets/i18n/zh/
    - assets/i18n/hi/
    - assets/i18n/es/
    - assets/i18n/ja/
    - assets/i18n/fr/
    - assets/i18n/ru/
    - assets/i18n/ar/
    - assets/branding/
    # Menu bar and tray icons (HIN-101), a few kilobytes on every platform.
    - assets/branding/tray/
    # The end-of-interval chime (HIN-86). One file, 40 KB: a sound the app
    # plays is a sound it has to carry on every platform, and a soft two-tone
    # bell is all an interval ending needs to be.
    - assets/sounds/
    - assets/backgrounds/
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

# --- Generated native splash (run: dart run flutter_native_splash:create) ---
# Web + iOS splash come from the animated handoff (Design/handoff) — keep both false,
# otherwise the generator overwrites web/index.html and the iOS storyboard.
flutter_native_splash:
  color: "#F4F3EF"
  color_dark: "#131119"
  image: assets/branding/splash_icon.png
  image_dark: assets/branding/splash_icon_dark.png
  android_12:
    color: "#F4F3EF"
    color_dark: "#131119"
    image: assets/branding/splash_icon.png
    image_dark: assets/branding/splash_icon_dark.png
  web: false
  ios: false

# --- Generated app icons (run: dart run flutter_launcher_icons) ---
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  macos:
    generate: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#F4F3EF"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  adaptive_icon_monochrome: assets/branding/app_icon_foreground.png
  remove_alpha_ios: true

# --- Microsoft Store package (run: dart run msix:create --store) ---
#
# identity_name / publisher / publisher_display_name are copied verbatim from
# Partner Center → hinata → Product management → Product identity. The Store
# validates them character-exact and rejects the package on any mismatch.
#
# The version is NOT taken from `version:` above: the Store reserves the 4th
# field (revision) and requires it to be 0, while pubspec encodes the build
# number there. windows/fastlane passes --version X.Y.Z.0 explicitly.
msix_config:
  display_name: hinata
  publisher_display_name: 4hm4dr3
  identity_name: 4hm4dr3.hinata
  publisher: CN=0A922060-E40D-4D55-9D1D-83B9594F60E5
  # Abgerundete Variante (windows/store/round_app_icon.py). Das geteilte
  # app_icon.png ist randlos quadratisch — richtig für iOS und Androids
  # adaptive Maske, aber Windows maskiert nichts, sodass Kachel und Taskleiste
  # ein hartes helles Quadrat zeigen.
  logo_path: assets/branding/app_icon_windows.png
  # Windows' permission model. Every entry is registered in
  # release/permissions.yaml and must match the Store listing's
  # "This app can" section.
  #   internetClient — talk to the self-hosted Hinata Server
  #   microphone     — voice comments / audio for attached videos (record_windows)
  #   webcam         — photo/video capture for attachments (camera_windows,
  #                    driven by lib/core/platform/desktop_camera_delegate.dart)
  capabilities: internetClient, microphone, webcam
  # The "Supported languages" the Microsoft Store lists. Same set as
  # I18n.supportedLocales; store_languages_test.dart fails if they drift.
  languages: en-us, de-de, zh-cn, hi-in, es-es, ja-jp, fr-fr, ru-ru, ar-sa
  store: true
