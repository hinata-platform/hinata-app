name: App Store review status

# What does App Store Connect actually say about our submissions? Prints every
# recent version and review submission with its state and dates, so "Apple is
# not reviewing us" can be told apart from "it was never submitted".
#
#   Actions tab → "App Store review status" → Run workflow
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle id to inspect'
        type: string
        default: 'com.ahmadre.hinata'

jobs:
  status:
    name: Query App Store Connect
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install requests pyjwt cryptography
      - name: Review status
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: python ios/fastlane/review_status.py --bundle-id "${{ inputs.bundle_id }}"
